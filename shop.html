<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse TyreHub demo tyres." />
    <title>Shop Tyres — TyreHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="shop">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>
    <main id="main-content" class="page">
      <section class="page-hero">
        <div class="container">
          <p class="eyebrow light">Demo catalogue</p>
          <h1>Shop All Tyres</h1>
          <p>Explore a curated demo range for every road and every ride.</p>
          <form id="shop-search" class="page-search">
            <label class="sr-only" for="shop-search-input">Search tyres</label
            ><input
              id="shop-search-input"
              placeholder="Search tyres, brands or sizes..."
            /><button class="button" type="submit">Search <b>→</b></button>
          </form>
        </div>
      </section>
      <section class="container category-picker" id="category-picker"></section>
      <section class="container shop-layout">
        <button id="open-filters" class="filter-mobile" type="button">
          <span data-icon="filter"></span> Filters
        </button>
        <aside id="filters" class="filters" aria-label="Product filters">
          <div class="filters__title">
            <h2>Filters</h2>
            <button id="clear-filters" class="link-button" type="button">
              Clear all</button
            ><button
              id="close-filters"
              class="close-filters"
              type="button"
              aria-label="Close filters"
            >
              ×
            </button>
          </div>
          <div id="filter-controls"></div>
        </aside>
        <div class="shop-results">
          <div class="results-bar">
            <p id="results-count" aria-live="polite">Loading products...</p>
            <label
              >Sort by
              <select id="sort-products">
                <option value="relevance">Relevance</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="rating">Highest Rated</option>
                <option value="newest">Newest</option>
              </select></label
            >
          </div>
          <div id="active-filters" class="active-filters"></div>
          <div id="products-grid" class="products-grid">
            <p class="loading">Loading products...</p>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shop.js"></script>
  </body>
</html>
