<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account — TyreHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="register">
    <div id="site-header"></div>
    <main class="auth-page" id="main-content">
      <section class="auth-card">
        <p class="eyebrow">Portfolio demo</p>
        <h1>Create demo account</h1>
        <p>For this demo, use non-sensitive details only.</p>
        <form id="register-form" class="form-grid">
          <label
            >Full name<input
              name="name"
              required
              autocomplete="name"
              placeholder="Your name" /></label
          ><label
            >Email<input
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com" /></label
          ><label
            >Phone<input
              name="phone"
              required
              inputmode="tel"
              pattern="[0-9+ -]{7,}"
              placeholder="98765 43210" /></label
          ><label
            >Password<input
              name="password"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="At least 6 characters" /></label
          ><label
            >Confirm password<input
              name="confirm"
              type="password"
              required
              minlength="6"
              autocomplete="new-password"
              placeholder="Repeat password" /></label
          ><button class="button" type="submit">Create Account <b>→</b></button>
          <p id="auth-message" class="form-message" aria-live="polite"></p>
        </form>
        <p class="auth-switch">
          Already registered? <a href="login.html">Login</a>
        </p>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
