<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — TyreHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="login">
    <div id="site-header"></div>
    <main class="auth-page" id="main-content">
      <section class="auth-card">
        <p class="eyebrow">Demo account access</p>
        <h1>Welcome back</h1>
        <p>Sign in to access your demo orders.</p>
        <form id="login-form" class="form-grid">
          <label
            >Email<input
              name="email"
              type="email"
              required
              autocomplete="email"
              placeholder="you@example.com" /></label
          ><label
            >Password<input
              name="password"
              type="password"
              required
              minlength="6"
              autocomplete="current-password"
              placeholder="••••••••" /></label
          ><button class="button" type="submit">Login <b>→</b></button>
          <p id="auth-message" class="form-message" aria-live="polite"></p>
        </form>
        <p class="auth-switch">
          New to TyreHub? <a href="register.html">Create demo account</a>
        </p>
      </section>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
