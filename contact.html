<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact TyreHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body data-page="contact">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="site-header"></div>
    <main id="main-content" class="page container">
      <div class="contact-layout">
        <section>
          <p class="eyebrow">We’re here to help</p>
          <h1>Contact TyreHub</h1>
          <p>
            Send a note about this demo experience. No messages are transmitted.
          </p>
          <div class="contact-points">
            <p>
              <span data-icon="headphones"></span>Helpful, human-friendly
              guidance
            </p>
            <p><span data-icon="clock"></span>Demo support: 9am–6pm</p>
            <p>
              <span data-icon="shield"></span>Portfolio project — no real
              service
            </p>
          </div>
        </section>
        <form id="contact-form" class="contact-form">
          <label
            >Name<input name="name" required placeholder="Your name" /></label
          ><label
            >Email<input
              name="email"
              type="email"
              required
              placeholder="you@example.com" /></label
          ><label
            >Phone<input
              name="phone"
              required
              pattern="[0-9+ -]{7,}"
              placeholder="98765 43210" /></label
          ><label
            >Message<textarea
              name="message"
              required
              minlength="10"
              placeholder="How can we help?"
            ></textarea></label
          ><button class="button" type="submit">Send Message <b>→</b></button>
          <p id="contact-message" class="form-message" aria-live="polite"></p>
        </form>
      </div>
    </main>
    <div id="site-footer"></div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
